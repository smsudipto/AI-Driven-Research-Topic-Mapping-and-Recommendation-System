<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ThesisBridge{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --tb-dark-blue: #0f2341;
            --tb-active-nav: #1c355e;
            --tb-bg-light: #f4f7f9;
        }

        body {
            background-color: var(--tb-bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        html,
        body,
        [style*="overflow-y: auto"],
        .overflow-auto,
        .overflow-y-auto {
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: #8fa2b5 transparent;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        [style*="overflow-y: auto"]::-webkit-scrollbar,
        .overflow-auto::-webkit-scrollbar,
        .overflow-y-auto::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        html::-webkit-scrollbar-track,
        body::-webkit-scrollbar-track,
        [style*="overflow-y: auto"]::-webkit-scrollbar-track,
        .overflow-auto::-webkit-scrollbar-track,
        .overflow-y-auto::-webkit-scrollbar-track {
            background: transparent;
        }

        html::-webkit-scrollbar-thumb,
        body::-webkit-scrollbar-thumb,
        [style*="overflow-y: auto"]::-webkit-scrollbar-thumb,
        .overflow-auto::-webkit-scrollbar-thumb,
        .overflow-y-auto::-webkit-scrollbar-thumb {
            border: 2px solid transparent;
            border-radius: 999px;
            background: #8fa2b5;
            background-clip: padding-box;
        }

        html::-webkit-scrollbar-thumb:hover,
        body::-webkit-scrollbar-thumb:hover,
        [style*="overflow-y: auto"]::-webkit-scrollbar-thumb:hover,
        .overflow-auto::-webkit-scrollbar-thumb:hover,
        .overflow-y-auto::-webkit-scrollbar-thumb:hover {
            background: #5f788f;
            background-clip: padding-box;
        }

        /* Navbar Styling */
        .tb-navbar {
            background-color: var(--tb-dark-blue);
            padding-top: 0;
            padding-bottom: 0;
        }

        /* Brand Logo with Glowing/Gradient Effect */
        .tb-navbar .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
            text-decoration: none;
            letter-spacing: -0.3px;
        }

        /* "Thesis" text glow effect */
        .brand-thesis {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 0px 8px rgba(0, 242, 254, 0.4));
        }

        /* Cap Icon Glow */
        .brand-icon {
            color: #00f2fe;
            filter: drop-shadow(0px 0px 6px rgba(0, 242, 254, 0.5));
        }

        .brand-bridge {
            color: #ffffff;
        }

        .tb-navbar .nav-link {
            color: #d1dbe8;
            padding: 1.2rem 1rem !important;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tb-navbar .nav-link:hover,
        .tb-navbar .nav-link.active {
            color: #ffffff;
            background-color: var(--tb-active-nav);
        }

        /* Notification Badge */
        .notification-btn {
            position: relative;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.1rem;
        }

        .notification-badge {
            position: absolute;
            top: -3px;
            right: -5px;
            background-color: #e74c3c;
            color: white;
            font-size: 0.65rem;
            border-radius: 50%;
            padding: 2px 5px;
            font-weight: bold;
        }

        /* User Profile Pill */
        .user-pill {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 4px 12px 4px 5px;
            color: white;
            text-decoration: none;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Navigation Bar -->
    {% include 'navbar.html' %}

    <!-- Main Content Area -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
